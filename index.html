<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notebook MD</title>
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-file-plus" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 11v6M9 14h6"/></symbol>
      <symbol id="icon-folder-open" viewBox="0 0 24 24"><path d="M3 19.5 5.2 9.8A2 2 0 0 1 7.1 8H21l-2.3 10.2a2 2 0 0 1-2 1.6H4.5A1.5 1.5 0 0 1 3 18.3V5a2 2 0 0 1 2-2h5l2 2h5a2 2 0 0 1 2 2v1"/></symbol>
      <symbol id="icon-save" viewBox="0 0 24 24"><path d="M5 3h12l3 3v15H4V4a1 1 0 0 1 1-1z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></symbol>
      <symbol id="icon-save-as" viewBox="0 0 24 24"><path d="M5 3h12l3 3v7M4 4v17h8M8 3v6h8V3M8 21v-7h6"/><path d="m15 19 4.8-4.8a1.4 1.4 0 0 1 2 2L17 21l-3 .7z"/></symbol>
      <symbol id="icon-export" viewBox="0 0 24 24"><path d="M14 3H5v18h14v-9M14 3v5h5"/><path d="M13 15h9M18 10l4 5-4 5"/></symbol>
      <symbol id="icon-print" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></symbol>
      <symbol id="icon-outline" viewBox="0 0 24 24"><path d="M4 6h2M10 6h10M4 12h2M10 12h10M4 18h2M10 18h10"/></symbol>
      <symbol id="icon-theme" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-1.1-.8-2-1.9-2H17a2 2 0 0 1-2-2V5.9C15 4.8 14.1 4 13 4z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7.5" r="1"/><circle cx="8.5" cy="15" r="1"/></symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"/></symbol>
      <symbol id="icon-split-right" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></symbol>
      <symbol id="icon-split-down" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18"/></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
      <symbol id="icon-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></symbol>
      <symbol id="icon-command" viewBox="0 0 24 24"><path d="M9 6H6a3 3 0 1 1 3-3v18a3 3 0 1 1-3-3h12a3 3 0 1 1-3 3V3a3 3 0 1 1 3 3z"/></symbol>
      <symbol id="icon-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16M15 4v16"/></symbol>
      <symbol id="icon-code" viewBox="0 0 24 24"><path d="m8 9-4 3 4 3M16 9l4 3-4 3M14 5l-4 14"/></symbol>
      <symbol id="icon-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.2 1.2M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.2-1.2"/></symbol>
      <symbol id="icon-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    </svg>

    <div id="app">
      <header class="toolbar">
        <div class="brand" aria-label="Notebook MD"><span class="brand-mark" aria-hidden="true">M<span>↓</span></span><span class="brand-name">Notebook MD</span></div>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <nav class="toolbar-actions" aria-label="文件操作">
          <button id="btn-new" class="toolbar-button"><svg><use href="#icon-file-plus"/></svg><span>新建</span></button>
          <button id="btn-open" class="toolbar-button"><svg><use href="#icon-folder-open"/></svg><span>打开</span></button>
          <button id="btn-save" class="toolbar-button"><svg><use href="#icon-save"/></svg><span>保存</span></button>
          <button id="btn-saveas" class="toolbar-button"><svg><use href="#icon-save-as"/></svg><span>另存为</span></button>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <button id="btn-export" class="toolbar-button"><svg><use href="#icon-export"/></svg><span>导出 HTML</span></button>
          <button id="btn-pdf" class="toolbar-button"><svg><use href="#icon-print"/></svg><span>导出 PDF</span></button>
        </nav>
        <div class="document-title" aria-live="polite"><span id="title">未命名.md</span><span class="title-dot" aria-hidden="true"></span></div>
        <nav class="toolbar-trailing" aria-label="视图操作">
          <button id="btn-command" class="toolbar-button icon-only" title="命令面板 (Ctrl+P)" aria-label="打开命令面板"><svg><use href="#icon-command"/></svg></button>
          <button id="btn-split-right" class="toolbar-button icon-only" title="向右分屏" aria-label="向右分屏"><svg><use href="#icon-split-right"/></svg></button>
          <button id="btn-split-down" class="toolbar-button icon-only" title="向下分屏" aria-label="向下分屏"><svg><use href="#icon-split-down"/></svg></button>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <button id="btn-outline" class="toolbar-button"><svg><use href="#icon-outline"/></svg><span>大纲</span></button>
          <button id="btn-theme" class="toolbar-button"><svg><use href="#icon-theme"/></svg><span>主题</span></button>
          <button id="btn-settings" class="toolbar-button"><svg><use href="#icon-settings"/></svg><span>设置</span></button>
        </nav>
      </header>

      <div id="settings-pop" class="settings-pop hidden" role="dialog" aria-label="编辑器设置">
        <div class="settings-row"><label for="set-font">字体</label><select id="set-font"></select></div>
        <div class="settings-row"><label>字号</label><div class="font-size-group"><button id="set-size-dec" aria-label="减小字号">−</button><span id="st-font">15px</span><button id="set-size-inc" aria-label="增大字号">＋</button></div></div>
        <div class="settings-row"><label for="set-html-theme">HTML 代码主题</label><select id="set-html-theme"><option value="idea">IDEA Darcula</option><option value="obsidian">Obsidian</option></select></div>
        <div class="settings-row"><label for="set-code-theme">代码块主题</label><select id="set-code-theme"><option value="idea">IDEA Darcula</option><option value="obsidian">Obsidian</option></select></div>
        <div class="settings-row"><label for="set-code-bg">代码块背景</label><select id="set-code-bg"></select></div>
      </div>

      <div class="main">
        <aside id="outline" aria-label="文档大纲"><div class="side-panel-header"><span>大纲</span><svg aria-hidden="true"><use href="#icon-outline"/></svg></div><div id="outline-list"></div></aside>
        <div class="workbench">
          <div id="tabbar" class="tab-bar" role="tablist" aria-label="打开的文件"></div>
          <section id="editor-stage" class="editor-stage" data-orientation="right">
            <section id="pane-primary" class="editor-pane active" data-pane="primary">
              <header class="pane-header"><span class="pane-name">未命名.md</span><span class="pane-dirty" aria-hidden="true"></span></header>
              <main id="editor" class="editor-host"></main>
            </section>
            <div id="split-divider" class="split-divider" role="separator" tabindex="0" aria-label="调整分屏大小"></div>
            <section id="pane-secondary" class="editor-pane" data-pane="secondary">
              <header class="pane-header"><span class="pane-name">未命名.md</span><span class="pane-dirty" aria-hidden="true"></span><button id="btn-close-split" class="pane-close" aria-label="关闭分屏" title="关闭分屏"><svg><use href="#icon-x"/></svg></button></header>
              <main id="editor-secondary" class="editor-host"></main>
            </section>
          </section>
        </div>
      </div>

      <footer class="statusbar"><span id="st-path">—</span><span id="st-workspace"></span><span id="st-count">0 字</span><span id="st-pos">行 1 列 1</span><span id="st-encoding">UTF-8</span><span id="st-saved" class="saved-status">已保存</span></footer>
    </div>

    <div id="command-overlay" class="command-overlay hidden">
      <section id="command-palette" class="command-palette" role="dialog" aria-modal="true" aria-label="命令面板">
        <div class="command-search"><svg aria-hidden="true"><use href="#icon-search"/></svg><input id="command-input" type="text" autocomplete="off" spellcheck="false" placeholder="搜索命令或文件…" aria-label="搜索命令或文件" /><kbd>Esc</kbd></div>
        <div id="command-results" class="command-results" role="listbox"></div>
        <footer class="command-footer"><span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>Enter</kbd> 执行</span><span><kbd>Esc</kbd> 关闭</span></footer>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
