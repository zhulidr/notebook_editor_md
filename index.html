<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown 编辑器</title>
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <button id="btn-new">新建</button>
        <button id="btn-open">打开</button>
        <button id="btn-save">保存</button>
        <button id="btn-saveas">另存为</button>
        <button id="btn-export">导出HTML</button>
        <button id="btn-pdf">导出PDF</button>
        <button id="btn-outline">大纲</button>
        <button id="btn-theme">主题·自动</button>
        <button id="btn-settings">设置</button>
        <span id="title" class="title">未命名.md</span>
      </header>
      <div id="settings-pop" class="settings-pop hidden">
        <div class="settings-row">
          <label>字体</label>
          <select id="set-font"></select>
        </div>
        <div class="settings-row">
          <label>字号</label>
          <div class="font-size-group">
            <button id="set-size-dec">−</button>
            <span id="st-font">15px</span>
            <button id="set-size-inc">＋</button>
          </div>
        </div>
        <div class="settings-row">
          <label>HTML代码主题</label>
          <select id="set-html-theme">
            <option value="idea">IDEA Darcula</option>
            <option value="obsidian">Obsidian</option>
          </select>
        </div>
        <div class="settings-row">
          <label>代码块主题</label>
          <select id="set-code-theme">
            <option value="idea">IDEA Darcula</option>
            <option value="obsidian">Obsidian</option>
          </select>
        </div>
        <div class="settings-row">
          <label>代码块背景</label>
          <select id="set-code-bg"></select>
        </div>
      </div>
      <div id="tabbar" class="tab-bar"></div>
      <div class="main">
        <aside id="outline"></aside>
        <main id="editor"></main>
      </div>
      <footer class="statusbar">
        <span id="st-path">—</span>
        <span id="st-count">0 字</span>
        <span id="st-pos">行 1 列 1</span>
        <span id="st-saved">已保存</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
